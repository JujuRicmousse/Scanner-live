{lg:"PL",id:"HT_A03",s:"À JOUER",a:35,b:39,g:0,mom:25,shots:2,sot:2,market:"Over 0.5 1re MT",win:42,stake:"0,5 %",odds:[2.56,2.78,3.21,3.28,3.45,3.67]},

{lg:"PL",id:"MG_B05",s:"À JOUER",a:30,b:34,g:1,mom:35,shots:2,same:true,market:"Over 3.5 FT",win:48,stake:"0,5 %",odds:[2.35,2.39,2.43,2.49,2.49,2.56]},
{lg:"PL",id:"LG2_A04",s:"À JOUER",a:80,b:84,g:1,mom:20,shots:3,acc:1.2,market:"Over 1.5 FT",win:56,stake:"0,25 %",odds:[1.89,1.96,2.07,2.10,2.21,2.40]},

{lg:"SA",id:"LG2_A04_SA",s:"À JOUER",a:80,b:84,g:1,mom:20,shots:3,acc:1.2,market:"Over 1.5 FT",win:47,stake:"0,25 %",odds:[2.30,2.42,2.57,2.68,2.75,2.89]},

];
const leagues={17:"PL",23:"SA",34:"FR",8:"ES"};
let enabled=true,busy=false,audio=null;const seen=new Set(),firstByHalf=new Set();const $=x=>document.getElementById(x);
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
async function get(path){const c=new AbortController(),t=setTimeout(()=>c.abort(),14000);try{const r=await fetch(BASE+path,{cache:"no-store",signal:c.signal});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
function num(x){if(x===null||x===undefined||x==="")return null;const n=Number(String(x).replace(",","."));return Number.isFinite(n)?n:null}
function goals(m){const a=num(m.homeScore?.current),b=num(m.awayScore?.current);return a===null||b===null?null:a+b}
function minute(m){const st=m.status?.type,p=num(m.time?.currentPeriodStartTimestamp);if(st!=="inprogress"||p===null)return null;const period=(m.lastPeriod||"").toLowerCase();if(/extra|penalt/.test(period))return null;let off;if(/2|second|2nd/.test(period))off=45;else if(/1|first|1st/.test(period))off=0;else return null;const age=Math.floor((Date.now()/1000-p)/60);if(age<0||age>65)return null;return off+age}
function momentum(d,m){const pts=(d?.graphPoints||[]).filter(x=>num(x.minute)!==null&&num(x.value)!==null&&num(x.minute)<=m);function avg(a){return a.length?a.reduce((s,x)=>s+Math.abs(num(x.value)),0)/a.length:null}const recent=pts.filter(x=>x.minute>=m-4),prev=pts.filter(x=>x.minute>=m-14&&x.minute<=m-5);const mo=recent.length===5?avg(recent):null,pr=prev.length===10?avg(prev):null;const last=pts.slice(-3);const same=last.length===3?last.every(x=>Math.sign(num(x.value))===Math.sign(num(last[0].value))&&num(x.value)!==0):null;return{mom:mo,acc:mo!==null&&pr>0?mo/pr:null,same}}
function shots(d,m,w,target){const arr=d?.shotmap;if(!Array.isArray(arr))return null;let count=0;for(const s of arr){const t=num(s.time),inj=num(s.addedTime)||0;if(t===null)continue;const at=t+inj;if(at<m-w+1||at>m)continue;if(!target){count++;continue}const typ=String(s.shotType||"").toLowerCase();if(typ==="goal"||typ==="save")count++}return count}
function evaluate(r,met){const checks=[["MOM5",r.mom,met.mom],["tirs5",r.shots,met.shots],["SOT10",r.sot,met.sot],["ACC",r.acc,met.acc]];let missing=[],failed=[];for(const [name,threshold,val] of checks){if(threshold===undefined)continue;if(val===null)missing.push(name);else if(val<threshold)failed.push(name+" "+val.toFixed(2)+" < "+threshold)}if(r.same){if(met.same===null)missing.push("same3");else if(!met.same)failed.push("same3")}return{missing,failed}}
function beep(obs){if(!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=obs?520:850;g.gain.value=.13;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.24)}catch(e){}}
function systemNotification(title,body){try{if(!("Notification" in window)||Notification.permission!=="granted")return false;const n=new Notification(title,{body,silent:true,tag:"betting-live-"+title+"-"+body,renotify:false});n.onclick=()=>{try{window.focus()}catch(e){};n.close()};return true}catch(e){$("notifstatus").textContent="Notification impossible : "+e.message;return false}}
function announce(r,m,min){const key=m.id+"|"+r.lg+"|"+r.id;if(seen.has(key))return;const half=min<45?"H1":"H2",hkey=m.id+"|"+half;if(r.s==="À JOUER"&&firstByHalf.has(hkey))return;seen.add(key);if(r.s==="À JOUER")firstByHalf.add(hkey);const card=el("div",undefined,"card "+(r.s==="OBSERVATION"?"obs":"signal"));card.append(el("strong",(r.s==="OBSERVATION"?"OBSERVATION":"CANDIDAT STATISTIQUE")+" • "+r.id));card.append(el("p",m.homeTeam.name+" – "+m.awayTeam.name+" • "+min+"' • "+r.market));card.append(el("p","Historique "+r.win+" % · "+(r.odds?"Cote mini immédiate "+r.odds[0].toFixed(2):"Observation seulement"),"small"));card.append(el("p","Cote Orbitx non vérifiée. Vérifier le score et la cote avant toute décision.","warn small"));const wrap=$("alerts");if(wrap.querySelector("p.muted"))wrap.innerHTML="";wrap.prepend(card);systemNotification("BETTING LIVE · "+r.id,m.homeTeam.name+" – "+m.awayTeam.name+" · "+min+"’ · "+r.market+" · cote à vérifier");beep(r.s==="OBSERVATION");}
async function scan(){if(busy)return;busy=true;$("lastscan").textContent="Actualisation lancée à "+new Date().toLocaleTimeString("fr-FR")+" · page "+document.visibilityState;$("refresh").disabled=true;$("status").textContent="Actualisation en cours…";try{const d=await get("/sport/football/events/live"),all=d.events||[],matches=all.filter(m=>leagues[m.tournament?.uniqueTournament?.id]);$("status").textContent=all.length+" matchs LIVE · "+matches.length+" suivis · "+new Date().toLocaleTimeString("fr-FR");$("matches").innerHTML="";let errors=0;for(const m of matches){const lg=leagues[m.tournament.uniqueTournament.id],min=minute(m),g=goals(m),card=el("div",undefined,"card");$("matches").append(card);card.append(el("strong",lg+" • "+m.homeTeam.name+" – "+m.awayTeam.name));card.append(el("p",(m.homeScore?.current??"?")+"–"+(m.awayScore?.current??"?")+" · minute "+(min??"non déterminée"),"muted"));if(min===null||g===null)continue;const applicable=rules.filter(r=>r.lg===lg&&min>=r.a&&min<=r.b&&g===r.g);if(!applicable.length)continue;const result=await Promise.allSettled(["graph","shotmap"].map(x=>get("/event/"+m.id+"/"+x)));const gr=result[0].status==="fulfilled"?result[0].value:null,sh=result[1].status==="fulfilled"?result[1].value:null;if(!gr||!sh)errors++;const mm=momentum(gr,min),met={...mm,shots:shots(sh,min,5,false),sot:shots(sh,min,10,true)};card.append(el("p","MOM5 "+(met.mom?.toFixed(1)??"?")+" · tirs5 "+(met.shots??"?")+" · SOT10 "+(met.sot??"?")+" · ACC "+(met.acc?.toFixed(2)??"?")+" · same3 "+(met.same??"?"),"small muted"));for(const r of applicable){const e=evaluate(r,met);if(e.failed.length){card.append(el("p",r.id+" : conditions non remplies ("+e.failed.join(", ")+")","small muted"));continue}if(e.missing.length){card.append(el("p",r.id+" : données insuffisantes ("+e.missing.join(", ")+")","warn small"));continue}card.append(el("p",r.id+" : conditions statistiques réunies · cote non vérifiée","ok"));announce(r,m,min)}}$("diagnostic").textContent=errors?"Attention : "+errors+" match(s) avec graph/shotmap indisponible.":"Rappel : minute et tirs récents sont à valider sur matchs réels. Android peut suspendre Chrome en arrière-plan."}catch(e){$("status").textContent="Erreur : "+e.message}finally{$("lastscan").textContent="Dernière tentative terminée à "+new Date().toLocaleTimeString("fr-FR")+" · page "+document.visibilityState;busy=false;$("refresh").disabled=false}}
$("notify").onclick=async()=>{const out=$("notifstatus");if(!("Notification" in window)){out.textContent="Notifications système indisponibles dans ce navigateur/contexte.";return}try{let perm=Notification.permission;if(perm==="default")perm=await Notification.requestPermission();out.textContent="Autorisation : "+perm+" · contexte sécurisé : "+window.isSecureContext+" · page : "+location.protocol;if(perm==="granted"){const ok=systemNotification("BETTING LIVE · TEST","Ceci est une notification silencieuse de test.");if(!ok)out.textContent+=" · affichage impossible"}else out.textContent+=" · Chrome ne permet pas cette notification ici."}catch(e){out.textContent="Test impossible : "+e.message}};$("refresh").onclick=scan;$("auto").onclick=()=>{enabled=!enabled;$("auto").textContent="Auto : "+(enabled?"ON (3 min)":"OFF")};$("sound").onclick=async()=>{try{audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();beep(false);$("sound").textContent="Son activé"}catch(e){alert("Son indisponible : "+e.message)}};setInterval(()=>{if(enabled)scan()},180000);document.addEventListener("visibilitychange",()=>{$("diagnostic").textContent="Page : "+document.visibilityState+" · les minuteries peuvent être suspendues par Android.";if(document.visibilityState==="visible"&&enabled)scan()});scan();
</script></body></html>
